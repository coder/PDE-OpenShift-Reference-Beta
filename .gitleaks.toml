# gitleaks config — enforces "no secret values in this public repo" (D5).
# Uses the default ruleset; allowlist only placeholders/examples as they appear.
[extend]
useDefault = true

[allowlist]
description = "Intentional placeholders / examples (never real values)"
paths = [
  '''.*\.example$''',
  '''terraform/terraform\.tfvars\.example''',
]
regexes = [
  '''__[A-Z0-9_]+__''',          # template placeholders
  '''<[A-Z0-9_-]+>''',           # <PLACEHOLDER> style
  '''CHANGE_?ME''',
]
