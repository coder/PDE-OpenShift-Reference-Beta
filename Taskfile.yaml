# =============================================================================
# PDE-OpenShift-Reference — task runner (go-task / https://taskfile.dev).
#
# Orchestrates the in-cluster deploy on an ALREADY-INSTALLED OpenShift cluster
# (bring-up = openshift-install + terraform, see install/ and terraform/).
# Prereqs for a fresh account are in docs/deploy.md.
#
# Usage:
#   task                              - list tasks
#   task preflight                    - check tooling + cluster login
#   task deploy                       - bootstrap -> apps -> IRSA -> GPU -> templates -> AI providers (connected)
#   task deploy MODE=airgap           - + air-gap overlay (run `task mirror` first)
#   task bootstrap                    - operators + Argo root app-of-apps
#   task gpu-node                     - derive a g5.2xlarge GPU MachineSet
#   task push-templates               - coder templates push (needs `coder login`)
#   task ai-provider                  - AI Gateway providers (vLLM [+ Bedrock]) + Coder Agents models (needs `coder login` + license)
#   task coder-irsa                   - annotate the coder SA with CODER_BEDROCK_ROLE_ARN + restart Coder
#   task creds [KEYCLOAK_NS=<ns>]      - print demo logins (reads live Secrets)
#   task status | reset | mirror | destroy
#
# Deploy-time env (never committed, D5):
#   CERT_MANAGER_ROLE_ARN   - IRSA role for cert-manager->Route53 (terraform output)
#   CODER_BEDROCK_ROLE_ARN  - IRSA role for Coder->Bedrock (optional, connected)
# =============================================================================

version: '3'

vars:
  MODE: '{{.MODE | default "connected"}}'            # connected | airgap
  KEYCLOAK_NS: '{{.KEYCLOAK_NS | default "keycloak"}}'
  WORKSPACE_NS: '{{.WORKSPACE_NS | default "coder-workspaces"}}'
  SERVING_NS: '{{.SERVING_NS | default "rhoai-serving"}}'
  GITOPS_NS: '{{.GITOPS_NS | default "openshift-gitops"}}'
  CODER_NS: '{{.CODER_NS | default "coder"}}'
  # OCI ModelCar image (internal registry) used by the air-gap InferenceService.
  MODELCAR_IMAGE: '{{.MODELCAR_IMAGE | default "image-registry.openshift-image-registry.svc:5000/rhoai-serving/qwen25-7b-modelcar:latest"}}'
  # Workspace image registry passed to the templates' `image_registry` variable:
  # connected pulls the public GHCR build directly; airgap pulls the copy that
  # `task mirror` puts in the internal registry.
  WORKSPACE_IMAGE_REGISTRY: '{{.WORKSPACE_IMAGE_REGISTRY | default (eq .MODE "airgap" | ternary "image-registry.openshift-image-registry.svc:5000/coder-workspaces" "ghcr.io/coder/pde-openshift-reference")}}'
  # Claude Code model (workspace-agent). Passed explicitly because
  # `coder templates push` carries over the previous version's variable values,
  # so a changed template default would never reach an existing deployment.
  # Must be one of the Bedrock provider's models (ai-providers/configure.py).
  ANTHROPIC_MODEL: '{{.ANTHROPIC_MODEL | default "global.anthropic.claude-haiku-4-5-20251001-v1:0"}}'

tasks:

  default:
    desc: List available tasks
    cmds:
      - task --list
    silent: true

  help:
    desc: List available tasks
    cmds:
      - task --list
    silent: true

  preflight:
    desc: Check tooling + cluster login
    silent: true
    cmds:
      - |
        set -euo pipefail
        echo "[preflight] tooling + cluster access..."
        command -v oc >/dev/null || { echo "  MISSING: oc"; exit 1; }
        oc whoami >/dev/null 2>&1 || { echo "  NOT LOGGED IN: set KUBECONFIG or 'oc login'"; exit 1; }
        echo "  cluster: $(oc whoami --show-server)"
        echo "  mode:    {{.MODE}}"
        [ -n "${CERT_MANAGER_ROLE_ARN:-}" ] || echo "  WARN: CERT_MANAGER_ROLE_ARN unset -> wildcard TLS falls back to the default ingress cert"
        oc get secret pull-secret -n openshift-config >/dev/null 2>&1 || echo "  WARN: cluster pull-secret not found (needed for registry.redhat.io images)"

  deploy:
    desc: Deploy on an installed cluster (MODE=connected|airgap)
    silent: true
    cmds:
      - task: preflight
      - task: bootstrap
      - task: irsa
      - task: gpu-node
      - task: wait-apps
      - task: coder-irsa
      - task: push-templates
      - task: ai-provider
      - task: '{{if eq .MODE "airgap"}}airgap-enable{{else}}airgap-disable{{end}}'
      - |
        echo "[deploy] done (MODE={{.MODE}}). Next: 'task creds' for demo logins; 'task status' for health."

  bootstrap:
    desc: Install operators (OLM) + apply the Argo root app-of-apps
    silent: true
    cmds:
      - |
        set -euo pipefail
        command -v oc >/dev/null || { echo "MISSING: oc"; exit 1; }
        echo "[bootstrap] applying operator subscriptions..."
        oc apply -f gitops/operators/
        echo "[bootstrap] waiting for the Argo CD (Applications) CRD..."
        for i in $(seq 1 60); do
          oc get crd applications.argoproj.io >/dev/null 2>&1 && break
          echo "  waiting for OpenShift GitOps operator ($i)"; sleep 10
        done
        oc get crd applications.argoproj.io >/dev/null 2>&1 || { echo "  Argo CRD not ready"; exit 1; }
        echo "[bootstrap] waiting for the {{.GITOPS_NS}} namespace + default Argo CD instance..."
        for i in $(seq 1 60); do
          oc get argocd openshift-gitops -n {{.GITOPS_NS}} >/dev/null 2>&1 && break
          echo "  waiting for {{.GITOPS_NS}}/openshift-gitops ($i)"; sleep 10
        done
        oc get argocd openshift-gitops -n {{.GITOPS_NS}} >/dev/null 2>&1 || { echo "  Argo CD instance not ready"; exit 1; }
        echo "[bootstrap] granting the Argo application controller cluster-admin..."
        oc apply -f gitops/bootstrap/argocd-controller-rbac.yaml
        echo "[bootstrap] applying root app-of-apps..."
        oc apply -f gitops/bootstrap/root-app.yaml
        echo "[bootstrap] Argo is reconciling all apps (track: task status)."

  irsa:
    desc: Annotate the cert-manager ServiceAccount with its IRSA role
    silent: true
    cmds:
      - |
        set -euo pipefail
        command -v oc >/dev/null || { echo "MISSING: oc"; exit 1; }
        if [ -z "${CERT_MANAGER_ROLE_ARN:-}" ]; then
          echo "[irsa] CERT_MANAGER_ROLE_ARN unset -> skipping (wildcard cert uses default ingress cert)."
        else
          echo "[irsa] waiting for the cert-manager ServiceAccount..."
          for i in $(seq 1 60); do oc get sa cert-manager -n cert-manager >/dev/null 2>&1 && break; sleep 10; done
          oc annotate sa cert-manager -n cert-manager eks.amazonaws.com/role-arn="$CERT_MANAGER_ROLE_ARN" --overwrite
          # Recreate the pod so the pod-identity webhook injects the AWS web-identity env
          # (the RH operator owns the Deployment and reverts `rollout restart`).
          oc delete pod -n cert-manager -l app.kubernetes.io/name=cert-manager --ignore-not-found
          echo "[irsa] cert-manager SA annotated."
        fi

  coder-irsa:
    desc: Annotate the coder SA with the Bedrock IRSA role (CODER_BEDROCK_ROLE_ARN) + restart Coder
    silent: true
    cmds:
      - |
        set -euo pipefail
        command -v oc >/dev/null || { echo "MISSING: oc"; exit 1; }
        if [ -z "${CODER_BEDROCK_ROLE_ARN:-}" ]; then
          echo "[coder-irsa] CODER_BEDROCK_ROLE_ARN unset -> skipping (no Bedrock; RHOAI-only AI)."; exit 0
        fi
        echo "[coder-irsa] waiting for the coder ServiceAccount..."
        for i in $(seq 1 60); do oc get sa coder -n {{.CODER_NS}} >/dev/null 2>&1 && break; sleep 10; done
        cur=$(oc get sa coder -n {{.CODER_NS}} -o jsonpath='{.metadata.annotations.eks\.amazonaws\.com/role-arn}')
        if [ "$cur" = "$CODER_BEDROCK_ROLE_ARN" ]; then
          echo "[coder-irsa] coder SA already annotated."; exit 0
        fi
        oc annotate sa coder -n {{.CODER_NS}} eks.amazonaws.com/role-arn="$CODER_BEDROCK_ROLE_ARN" --overwrite
        # New pods get the web-identity env from the pod-identity webhook.
        oc rollout restart deploy/coder -n {{.CODER_NS}}
        oc rollout status deploy/coder -n {{.CODER_NS}} --timeout=10m
        echo "[coder-irsa] coder SA annotated for Bedrock; Coder restarted."

  gpu-node:
    desc: Ensure a g5.2xlarge GPU MachineSet (derived from a worker MachineSet)
    silent: true
    cmds:
      - |
        set -euo pipefail
        command -v oc >/dev/null || { echo "MISSING: oc"; exit 1; }
        if oc get machineset -n openshift-machine-api -o name 2>/dev/null | grep -qi gpu; then
          echo "[gpu] GPU MachineSet already present."; exit 0
        fi
        WS=$(oc get machineset -n openshift-machine-api -o name 2>/dev/null | head -1 || true)
        if [ -z "$WS" ]; then
          echo "[gpu] no worker MachineSet found; apply install/gpu-machineset.yaml.example by hand."; exit 0
        fi
        echo "[gpu] deriving a g5.2xlarge GPU MachineSet from $WS ..."
        oc get "$WS" -n openshift-machine-api -o json | python3 -c '
        import json,sys
        ms=json.load(sys.stdin); md=ms["metadata"]; base=md["name"]; new=base+"-gpu"
        for k in ["resourceVersion","uid","creationTimestamp","generation","managedFields","selfLink","annotations"]:
            md.pop(k,None)
        ms.pop("status",None); md["name"]=new
        L="machine.openshift.io/cluster-api-machineset"
        ms["spec"]["replicas"]=1
        ms["spec"]["selector"]["matchLabels"][L]=new
        tpl=ms["spec"]["template"]; tpl["metadata"]["labels"][L]=new
        spec=tpl["spec"]; spec["providerSpec"]["value"]["instanceType"]="g5.2xlarge"
        spec.setdefault("taints",[])
        if not any(t.get("key")=="nvidia.com/gpu" for t in spec["taints"]):
            spec["taints"].append({"key":"nvidia.com/gpu","value":"true","effect":"NoSchedule"})
        print(json.dumps(ms))
        ' | oc apply -f -
        echo "[gpu] created. Wait for the node + NVIDIA operator to label it nvidia.com/gpu.present=true."

  wait-apps:
    desc: Wait for all Argo Applications to be Healthy + Synced
    silent: true
    cmds:
      - |
        set -euo pipefail
        command -v oc >/dev/null || { echo "MISSING: oc"; exit 1; }
        echo "[wait] waiting for Argo apps Healthy+Synced (up to ~20m)..."
        for i in $(seq 1 80); do
          out=$(oc get applications.argoproj.io -n {{.GITOPS_NS}} \
            -o jsonpath='{range .items[*]}{.metadata.name}={.status.health.status},{.status.sync.status}{"\n"}{end}' 2>/dev/null || true)
          notready=$(printf '%s\n' "$out" | grep -c -vE '=Healthy,Synced$' || true)
          [ "${notready:-1}" -eq 0 ] \
            && { echo "[wait] all apps Healthy+Synced."; printf '%s\n' "$out" | sed 's/^/  /'; break; }
          sleep 15
        done

  push-templates:
    desc: Push the workspace templates to Coder (needs `coder login`)
    silent: true
    cmds:
      - |
        set -euo pipefail
        if ! command -v coder >/dev/null; then
          echo "[templates] coder CLI not found -> skipping. Then: coder login https://coder.apps.cluster.<domain> && task push-templates"; exit 0
        fi
        for t in workspace-basic workspace-agent; do
          echo "[templates] pushing $t (image_registry={{.WORKSPACE_IMAGE_REGISTRY}}) ..."
          extra=""
          [ "$t" = workspace-agent ] && extra="--variable anthropic_model={{.ANTHROPIC_MODEL}}"
          coder templates push "$t" -d "templates/$t" --yes --variable image_registry="{{.WORKSPACE_IMAGE_REGISTRY}}" $extra
        done

  ai-provider:
    desc: Configure AI Gateway providers (vLLM; + Bedrock if Coder has its IRSA role) and Coder Agents models
    silent: true
    vars:
      # Headless predictor Service -> address the vLLM pod port directly.
      AI_PROVIDER_BASE_URL: '{{.AI_PROVIDER_BASE_URL | default (printf "http://qwen25-7b-predictor.%s.svc:8080/v1" .SERVING_NS)}}'
    cmds:
      - |
        set -euo pipefail
        if ! command -v coder >/dev/null || ! AIP_CODER_TOKEN=$(coder login token 2>/dev/null); then
          echo "[ai-provider] coder CLI not logged in -> skipping. Then: coder login https://coder.apps.cluster.<domain> && task ai-provider"; exit 0
        fi
        export AIP_CODER_TOKEN
        export AIP_CODER_URL=$(coder whoami -o json | sed -n 's/.*"url": *"\([^"]*\)".*/\1/p' | head -1)
        export VLLM_BASE_URL="{{.AI_PROVIDER_BASE_URL}}"
        # Bedrock only when the coder SA carries an IRSA role (task coder-irsa).
        role=$(oc get sa coder -n {{.CODER_NS}} -o jsonpath='{.metadata.annotations.eks\.amazonaws\.com/role-arn}' 2>/dev/null || true)
        export BEDROCK_ENABLE=$([ -n "${CODER_BEDROCK_ROLE_ARN:-$role}" ] && echo 1 || echo 0)
        python3 ai-providers/configure.py \
          || echo "[ai-provider] WARN: not configured; fix the error above, then re-run: task ai-provider"

  airgap-enable:
    desc: Apply the air-gap overlay (egress-deny + registry redirect + oci model)
    silent: true
    cmds:
      - |
        set -euo pipefail
        command -v oc >/dev/null || { echo "MISSING: oc"; exit 1; }
        echo "[airgap] applying egress NetworkPolicy + ImageDigestMirrorSet (Argo app)..."
        oc apply -f gitops/airgap/airgap-app.yaml
        echo "[airgap] switching the InferenceService to the OCI ModelCar (offline weights)..."
        oc patch inferenceservice qwen25-7b -n {{.SERVING_NS}} --type=merge \
          -p '{"spec":{"predictor":{"model":{"storageUri":"oci://{{.MODELCAR_IMAGE}}"}}}}' || \
          echo "  (InferenceService not present yet — rerun after P4 syncs)"
        echo "[airgap] done. Workspace egress is default-deny (in-cluster only)."

  airgap-disable:
    desc: Remove the air-gap overlay (return to connected posture)
    silent: true
    cmds:
      - |
        set -euo pipefail
        command -v oc >/dev/null || { echo "MISSING: oc"; exit 1; }
        oc delete -f gitops/airgap/airgap-app.yaml --ignore-not-found
        echo "[airgap] overlay removed (connected posture). Model storageUri reverts to hf:// on the next model-serving sync."

  reset:
    desc: Re-seed the Keycloak demo realm (re-run import job); prints cred-rotation/workspace cleanup hints, keeps infra
    silent: true
    cmds:
      - |
        set -euo pipefail
        command -v oc >/dev/null || { echo "MISSING: oc"; exit 1; }
        echo "[reset] re-seeding the Keycloak demo realm (re-run the import hook)..."
        oc delete job keycloak-realm-import -n {{.KEYCLOAK_NS}} --ignore-not-found
        oc -n {{.GITOPS_NS}} annotate application keycloak argocd.argoproj.io/refresh=hard --overwrite >/dev/null 2>&1 || true
        echo "[reset] to rotate demo credentials, delete the generated Secret (ESO regenerates):"
        echo "           oc delete secret keycloak-realm-secrets -n {{.KEYCLOAK_NS}}"
        echo "[reset] to wipe demo workspaces/chats, use the Coder UI/CLI (coder delete ...)."
        echo "[reset] infra untouched."

  status:
    desc: Show Argo apps + key workloads
    silent: true
    cmds:
      - |
        set -euo pipefail
        command -v oc >/dev/null || { echo "MISSING: oc"; exit 1; }
        echo "=== Argo Applications ==="
        oc get applications.argoproj.io -n {{.GITOPS_NS}} 2>/dev/null || echo "  (GitOps not installed)"
        echo "=== InferenceService ==="
        oc get inferenceservice -A 2>/dev/null || echo "  (KServe not ready)"
        echo "=== Routes ==="
        oc get route -A 2>/dev/null | grep -iE "coder|keycloak|gitea" || echo "  (none yet)"
        echo "=== GPU nodes ==="
        oc get nodes -l nvidia.com/gpu.present=true 2>/dev/null || echo "  (no GPU node yet)"

  mirror:
    desc: Populate the internal registry for air-gap (oc-mirror + modelcar)
    silent: true
    cmds:
      - |
        set -euo pipefail
        command -v oc >/dev/null || { echo "MISSING: oc"; exit 1; }
        echo "[mirror 1/3] workspace images GHCR -> internal registry..."
        NS={{.WORKSPACE_NS}} ./images/mirror-to-internal-registry.sh
        echo "[mirror 2/3] build + push the Qwen OCI ModelCar (needs HF egress at build time)..."
        if command -v podman >/dev/null; then BUILD=podman; elif command -v docker >/dev/null; then BUILD=docker; else echo "  SKIP: no podman/docker"; BUILD=""; fi
        if [ -n "$BUILD" ]; then
          $BUILD build -t "{{.MODELCAR_IMAGE}}" mirror/modelcar
          $BUILD push --tls-verify=false "{{.MODELCAR_IMAGE}}" 2>/dev/null || $BUILD push "{{.MODELCAR_IMAGE}}"
        fi
        echo "[mirror 3/3] operators + workload images via oc-mirror..."
        if command -v oc-mirror >/dev/null; then
          oc-mirror --config mirror/imageset-config.yaml docker://$(oc get route -n openshift-image-registry default-route -o jsonpath='{.spec.host}')
        else
          echo "  SKIP: oc-mirror not installed. Install it and run:"
          echo "    oc-mirror --config mirror/imageset-config.yaml docker://<MIRROR_REGISTRY>"
        fi
        echo "[mirror] done."

  vendor-modules:
    desc: Pre-fetch Coder registry modules into each template's cache (air-gap template push)
    silent: true
    cmds:
      - |
        set -euo pipefail
        command -v terraform >/dev/null || { echo "MISSING: terraform"; exit 1; }
        for t in workspace-basic workspace-agent; do
          echo "[vendor] $t ..."
          ( cd templates/$t && terraform init -backend=false -input=false >/dev/null && terraform get -update )
        done
        echo "[vendor] modules cached under templates/*/.terraform/modules."
        echo "         Push air-gap templates from a provisioner that mounts this cache,"
        echo "         or vendor the module source and set 'source = ./vendor/<module>'."

  creds:
    desc: Print demo login credentials (personas + Keycloak admin), read live from the cluster
    silent: true
    cmds:
      - |
        set -euo pipefail
        command -v oc >/dev/null || { echo "MISSING: oc"; exit 1; }
        oc get secret keycloak-realm-secrets -n {{.KEYCLOAK_NS}} >/dev/null 2>&1 || { \
          echo "keycloak-realm-secrets not found in ns '{{.KEYCLOAK_NS}}' — is identity deployed?"; exit 1; }
        get() { oc get secret "$1" -n {{.KEYCLOAK_NS}} -o jsonpath="{.data.$2}" | base64 -d; }
        echo "=== Demo personas (realm: demo) ==="
        printf '  %-9s %-10s %s\n' USER ROLE PASSWORD
        printf '  %-9s %-10s %s\n' alice   developer "$(get keycloak-realm-secrets alice_password)"
        printf '  %-9s %-10s %s\n' bob     auditor   "$(get keycloak-realm-secrets bob_password)"
        printf '  %-9s %-10s %s\n' demoadm admin     "$(get keycloak-realm-secrets demoadm_password)"
        echo
        echo "=== Keycloak admin console ==="
        kc_host=$(oc get route keycloak -n {{.KEYCLOAK_NS}} -o jsonpath='{.spec.host}' 2>/dev/null || true)
        [ -n "$kc_host" ] && echo "  URL:      https://$kc_host/admin" || echo "  URL:      (keycloak Route not found yet)"
        if oc get secret keycloak-initial-admin -n {{.KEYCLOAK_NS}} >/dev/null 2>&1; then
          printf '  %-9s %s\n' user     "$(get keycloak-initial-admin username)"
          printf '  %-9s %s\n' password "$(get keycloak-initial-admin password)"
        else echo "  (keycloak-initial-admin not created yet)"; fi

  destroy:
    desc: Tear down the cluster + AWS prerequisites (guarded)
    silent: true
    cmds:
      - |
        set -euo pipefail
        echo "[destroy] This DESTROYS the cluster + AWS prerequisites."
        echo "  1) openshift-install destroy cluster --dir <INSTALL_DIR>"
        echo "  2) (cd terraform && terraform destroy)   # Route53 zone + IRSA roles"
        if [ "${DESTROY_CONFIRM:-}" != "yes" ]; then
          echo "[destroy] NOT running. Set DESTROY_CONFIRM=yes INSTALL_DIR=<dir> to execute step 1 here."
          exit 0
        fi
        [ -n "${INSTALL_DIR:-}" ] && command -v openshift-install >/dev/null \
          && openshift-install destroy cluster --dir "$INSTALL_DIR" \
          || echo "[destroy] INSTALL_DIR unset or openshift-install missing — skipping cluster destroy."
        echo "[destroy] run 'cd terraform && terraform destroy' separately for the AWS prereqs."
