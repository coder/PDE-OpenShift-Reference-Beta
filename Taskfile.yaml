# =============================================================================
# PDE-OpenShift-Reference — task runner (go-task / https://taskfile.dev).
#
# Scaffold stage: tasks are wired with their intended contract but most are
# stubbed (echo + TODO) until the matching build phase lands. Nothing here
# mutates a cluster yet — except `creds`, which only reads live Secrets.
#
# Usage:
#   task              - list available tasks (same as `task --list`)
#   task help         - list available tasks
#   task preflight    - check required CLIs + context
#   task deploy       - one-command deploy (connected mode, default)
#   task deploy MODE=airgap           - air-gap-ready mode
#   task creds        - print demo logins, read live from the cluster
#   task creds KEYCLOAK_NS=<ns>        - override the Keycloak namespace
#   task reset        - return to a clean demo state
#   task status       - show Argo apps + key workloads
#   task mirror       - populate the internal registry for air-gap
#   task destroy      - tear down the cluster + infra
# =============================================================================

version: '3'

vars:
  MODE: '{{.MODE | default "connected"}}'            # connected | airgap
  KEYCLOAK_NS: '{{.KEYCLOAK_NS | default "keycloak"}}'
  WORKSPACE_NS: '{{.WORKSPACE_NS | default "coder-workspaces"}}'
  SERVING_NS: '{{.SERVING_NS | default "rhoai-serving"}}'
  # OCI ModelCar image (internal registry) used by the air-gap InferenceService.
  MODELCAR_IMAGE: '{{.MODELCAR_IMAGE | default "image-registry.openshift-image-registry.svc:5000/rhoai-serving/qwen25-7b-modelcar:latest"}}'

tasks:

  default:
    desc: List available tasks
    cmds:
      - task --list
    silent: true

  help:
    desc: List available tasks
    cmds:
      - task --list
    silent: true

  preflight:
    desc: Check required CLIs + context (oc, aws, terraform)
    silent: true
    cmds:
      - |
        set -euo pipefail
        echo "[preflight] checking tooling + cluster/AWS access..."
        command -v oc  >/dev/null || { echo "  MISSING: oc"; exit 1; }
        command -v aws >/dev/null || { echo "  MISSING: aws"; exit 1; }
        echo "  TODO(P1): assert KUBECONFIG reachable, AWS account == <AWS_ACCOUNT_ID>, base_domain set"

  deploy:
    desc: One-command deploy (MODE=connected|airgap)
    silent: true
    cmds:
      - task: preflight
      - |
        echo "[deploy MODE={{.MODE}}] TODO(P1-P5 bootstrap): oc apply gitops/bootstrap/root-app.yaml -> operators -> identity+SCM -> Coder -> RHOAI -> templates"
      - task: '{{if eq .MODE "airgap"}}airgap-enable{{else}}airgap-disable{{end}}'

  airgap-enable:
    desc: Apply the air-gap overlay (egress-deny + registry redirect + oci model)
    silent: true
    cmds:
      - |
        set -euo pipefail
        command -v oc >/dev/null || { echo "MISSING: oc"; exit 1; }
        echo "[airgap] applying egress NetworkPolicy + ImageDigestMirrorSet (Argo app)..."
        oc apply -f gitops/airgap/airgap-app.yaml
        echo "[airgap] switching the InferenceService to the OCI ModelCar (offline weights)..."
        oc patch inferenceservice qwen25-7b -n {{.SERVING_NS}} --type=merge \
          -p '{"spec":{"predictor":{"model":{"storageUri":"oci://{{.MODELCAR_IMAGE}}"}}}}' || \
          echo "  (InferenceService not present yet — rerun after P4 syncs)"
        echo "[airgap] done. Workspace egress is default-deny (in-cluster only)."

  airgap-disable:
    desc: Remove the air-gap overlay (return to connected posture)
    silent: true
    cmds:
      - |
        set -euo pipefail
        command -v oc >/dev/null || { echo "MISSING: oc"; exit 1; }
        oc delete -f gitops/airgap/airgap-app.yaml --ignore-not-found
        echo "[airgap] overlay removed (connected posture). Model storageUri reverts to hf:// on the next model-serving sync."

  reset:
    desc: Return to a clean demo state (workspaces/chats/projects), keep infra
    silent: true
    cmds:
      - |
        echo "[reset] TODO(P7): delete demo workspaces/chats + seed projects; re-seed identity"

  mirror:
    desc: Populate the internal registry for air-gap (oc-mirror + modelcar)
    silent: true
    cmds:
      - |
        set -euo pipefail
        command -v oc >/dev/null || { echo "MISSING: oc"; exit 1; }
        echo "[mirror 1/3] workspace images GHCR -> internal registry..."
        NS={{.WORKSPACE_NS}} ./images/mirror-to-internal-registry.sh
        echo "[mirror 2/3] build + push the Qwen OCI ModelCar (needs HF egress at build time)..."
        if command -v podman >/dev/null; then BUILD=podman; elif command -v docker >/dev/null; then BUILD=docker; else echo "  SKIP: no podman/docker"; BUILD=""; fi
        if [ -n "$BUILD" ]; then
          $BUILD build -t "{{.MODELCAR_IMAGE}}" mirror/modelcar
          $BUILD push --tls-verify=false "{{.MODELCAR_IMAGE}}" 2>/dev/null || $BUILD push "{{.MODELCAR_IMAGE}}"
        fi
        echo "[mirror 3/3] operators + workload images via oc-mirror..."
        if command -v oc-mirror >/dev/null; then
          oc-mirror --config mirror/imageset-config.yaml docker://$(oc get route -n openshift-image-registry default-route -o jsonpath='{.spec.host}')
        else
          echo "  SKIP: oc-mirror not installed. Install it and run:"
          echo "    oc-mirror --config mirror/imageset-config.yaml docker://<MIRROR_REGISTRY>"
        fi
        echo "[mirror] done."

  vendor-modules:
    desc: Pre-fetch Coder registry modules into each template's cache (air-gap template push)
    silent: true
    cmds:
      - |
        set -euo pipefail
        command -v terraform >/dev/null || { echo "MISSING: terraform"; exit 1; }
        for t in workspace-basic workspace-agent; do
          echo "[vendor] $t ..."
          ( cd templates/$t && terraform init -backend=false -input=false >/dev/null && terraform get -update )
        done
        echo "[vendor] modules cached under templates/*/.terraform/modules."
        echo "         Push air-gap templates from a provisioner that mounts this cache,"
        echo "         or vendor the module source and set 'source = ./vendor/<module>'."

  status:
    desc: Show Argo apps + key workloads
    silent: true
    cmds:
      - |
        echo "[status] TODO(P1): oc get applications -n openshift-gitops; oc get inferenceservice -A"

  creds:
    desc: Print demo login credentials (personas + Keycloak admin), read live from the cluster
    silent: true
    cmds:
      - |
        set -euo pipefail
        command -v oc >/dev/null || { echo "MISSING: oc"; exit 1; }
        oc get secret keycloak-realm-secrets -n {{.KEYCLOAK_NS}} >/dev/null 2>&1 || { \
          echo "keycloak-realm-secrets not found in ns '{{.KEYCLOAK_NS}}' — is identity deployed?"; exit 1; }
        get() { oc get secret "$1" -n {{.KEYCLOAK_NS}} -o jsonpath="{.data.$2}" | base64 -d; }
        echo "=== Demo personas (realm: demo) ==="
        printf '  %-9s %-10s %s\n' USER ROLE PASSWORD
        printf '  %-9s %-10s %s\n' alice   developer "$(get keycloak-realm-secrets alice_password)"
        printf '  %-9s %-10s %s\n' bob     auditor   "$(get keycloak-realm-secrets bob_password)"
        printf '  %-9s %-10s %s\n' demoadm admin     "$(get keycloak-realm-secrets demoadm_password)"
        echo
        echo "=== Keycloak admin console ==="
        kc_host=$(oc get route keycloak -n {{.KEYCLOAK_NS}} -o jsonpath='{.spec.host}' 2>/dev/null || true)
        [ -n "$kc_host" ] && echo "  URL:      https://$kc_host/admin" || echo "  URL:      (keycloak Route not found yet)"
        if oc get secret keycloak-initial-admin -n {{.KEYCLOAK_NS}} >/dev/null 2>&1; then
          printf '  %-9s %s\n' user     "$(get keycloak-initial-admin username)"
          printf '  %-9s %s\n' password "$(get keycloak-initial-admin password)"
        else echo "  (keycloak-initial-admin not created yet)"; fi

  destroy:
    desc: Tear down the cluster + infra
    silent: true
    cmds:
      - |
        echo "[destroy] TODO(P1): terraform destroy (+ openshift-install destroy)"
