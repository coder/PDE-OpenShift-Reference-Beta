# RHOAI DataScienceCluster (KServe RawDeployment) + vLLM ServingRuntime + InferenceService (Qwen2.5-7B on A10G).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: model-serving
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://github.com/coder/PDE-OpenShift-Reference-Beta.git
    targetRevision: main
    path: manifests/model-serving
  destination:
    server: https://kubernetes.default.svc
    namespace: rhoai-serving
  # Air-gap mode swaps the model storageUri hf:// -> oci:// (task airgap-enable).
  # Ignore that field so Argo keeps the connected default (hf://) in git while
  # not reverting the in-cluster air-gap patch.
  ignoreDifferences:
    - group: serving.kserve.io
      kind: InferenceService
      name: qwen25-7b
      jsonPointers:
        - /spec/predictor/model/storageUri
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 8
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
