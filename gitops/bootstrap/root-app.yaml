# Argo CD root "app-of-apps".
#
# Bootstraps every Application under gitops/apps/. Applied once (by `task deploy`
# / the bootstrap step) after the OpenShift GitOps operator is installed.
#
# NOTE: repoURL points at the PUBLIC repo over HTTPS (no credential needed for a
# public reference repo). Change targetRevision to a release tag when cutting one.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
    # Server-side diff: the API server applies CRD defaults, so defaulted fields
    # (e.g. ExternalSecret remoteRef.*) don't show as permanent OutOfSync.
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: default
  source:
    repoURL: https://github.com/coder/PDE-OpenShift-Reference-Beta.git
    targetRevision: main
    path: gitops/apps
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-gitops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
