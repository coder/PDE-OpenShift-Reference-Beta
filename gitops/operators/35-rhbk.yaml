# Red Hat Build of Keycloak (RHBK) operator — the single demo IdP (ADR D1).
#
# Channel: stable-v26 (current GA; catalog default is stable-v26.6 -> 26.6.x).
# NOTE: this supersedes the earlier planning note that referenced stable-v22
# (EOL-era Keycloak 22). The Keycloak CR in manifests/keycloak/keycloak.yaml is
# authored for the v26 operator schema (full-URL spec.hostname.hostname).
#
# Installed into its own namespace `keycloak` (same namespace the Keycloak
# instance + demo realm live in — see manifests/keycloak/).
---
apiVersion: v1
kind: Namespace
metadata:
  name: keycloak
  labels:
    app.kubernetes.io/part-of: pde-openshift-reference
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: rhbk-operator
  namespace: keycloak
spec:
  targetNamespaces:
    - keycloak
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: rhbk-operator
  namespace: keycloak
spec:
  channel: stable-v26
  name: rhbk-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  installPlanApproval: Automatic
