# Node Feature Discovery — labels nodes with GPU features so the GPU operator + RHOAI
# can schedule the vLLM ServingRuntime on the A10G node.
apiVersion: v1
kind: Namespace
metadata: { name: openshift-nfd }
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: openshift-nfd
  namespace: openshift-nfd
spec:
  targetNamespaces: [openshift-nfd]
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: nfd
  namespace: openshift-nfd
spec:
  channel: stable
  name: nfd
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  installPlanApproval: Automatic
