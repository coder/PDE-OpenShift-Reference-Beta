# External Secrets Operator (Red Hat). Drives D5: secrets generated in-cluster
# (Password generators) or synced from a store — never committed to this public repo.
apiVersion: v1
kind: Namespace
metadata: { name: external-secrets-operator, labels: { app.kubernetes.io/part-of: pde-openshift-reference } }
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: external-secrets-operator
  namespace: external-secrets-operator
spec: {}
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: openshift-external-secrets-operator
  namespace: external-secrets-operator
spec:
  channel: stable-v1
  name: openshift-external-secrets-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  installPlanApproval: Automatic
