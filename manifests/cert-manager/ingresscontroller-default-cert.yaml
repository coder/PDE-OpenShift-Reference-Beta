# Set the cluster's default ingress certificate to the cert-manager-issued
# wildcard (apps-wildcard-cert in openshift-ingress). Every edge-terminated
# Route without its own cert then serves valid TLS.
#
# Scoped server-side apply + force-conflicts: spec.defaultCertificate is
# otherwise owned by the ingress operator's field manager; editing the default
# IngressController is the supported way to set the default serving cert.
#
# Depends on the apps-wildcard-cert Secret existing first (sync-wave 2, after
# the Certificate at wave 1).
apiVersion: operator.openshift.io/v1
kind: IngressController
metadata:
  name: default
  namespace: openshift-ingress-operator
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    # Prune=false: never let Argo delete the cluster's default router.
    argocd.argoproj.io/sync-options: ServerSideApply=true,Prune=false
spec:
  defaultCertificate:
    name: apps-wildcard-cert
  # Coder workspace apps use wildcard Routes (*.coder.apps..., manifests/coder/routes.yaml).
  # Kept in this one manifest: two Argo apps applying the same IngressController
  # under the same SSA field manager drop each other's fields and never sync.
  routeAdmission:
    wildcardPolicy: WildcardsAllowed
