# External Secrets Operator — controller instance (ADR D5).
#
# The Subscription/OperatorGroup live in gitops/operators/30-external-secrets.yaml
# (bootstrap-applied). This CR tells the operator to actually DEPLOY the
# external-secrets controller into the `external-secrets` namespace.
#
# No AWS Secrets Manager / IRSA here (unlike the prior RH Summit demo): ADR D5
# forbids any secret material in this public repo, including ciphertext. All
# demo credentials are generated IN-CLUSTER at deploy time by ESO `Password`
# generators (see manifests/keycloak/realm-secrets.yaml) and shared to
# consumers via a Kubernetes-provider ClusterSecretStore. So the controller
# needs no external provider wiring — just to exist.
---
apiVersion: operator.openshift.io/v1alpha1
kind: ExternalSecretsConfig
metadata:
  name: cluster
  labels:
    app.kubernetes.io/part-of: pde-openshift-reference
spec: {}
