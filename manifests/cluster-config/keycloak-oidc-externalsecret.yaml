# OpenShift OAuth client secret for the Keycloak IdP (ADR D5).
#
# Pulls the shared `openshift_client_secret` (generated into
# keycloak-realm-secrets in the keycloak namespace) through the
# Kubernetes-provider ClusterSecretStore `keycloak-realm-kv`, and materializes
# it in openshift-config as the Secret `keycloak-openshift-oidc-secret` with the
# key `clientSecret` that the OAuth CR (oauth-cluster.yaml) references.
#
# Same value Keycloak holds for the `openshift` client, so the OIDC handshake
# matches. No secret value is ever committed.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-openshift-oidc-secret
  namespace: openshift-config
  labels:
    app.kubernetes.io/part-of: pde-openshift-reference
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: keycloak-realm-kv
  target:
    name: keycloak-openshift-oidc-secret
    creationPolicy: Owner
  data:
    - secretKey: clientSecret
      remoteRef:
        key: keycloak-realm-secrets
        property: openshift_client_secret
