# OpenShift Route for Gitea — edge TLS at the Route (same pattern as Keycloak).
#
# The Helm chart's own ingress/route are disabled (see gitops/apps/scm.yaml);
# we manage the Route here for consistent edge-TLS + cert-manager wiring. It
# targets the chart's HTTP Service `gitea-http` (fullnameOverride: gitea), port
# name `http` (3000). cert-manager annotations populate the cert once the
# ClusterIssuer exists (later phase); until then the default ingress cert serves.
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: gitea
  namespace: scm
  labels:
    app.kubernetes.io/name: gitea
    app.kubernetes.io/part-of: pde-openshift-reference
  annotations:
    cert-manager.io/issuer-kind: ClusterIssuer
    cert-manager.io/issuer-name: letsencrypt-prod
spec:
  host: gitea.apps.cluster.rh-pde.coderdemo.io
  to:
    kind: Service
    name: gitea-http
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
