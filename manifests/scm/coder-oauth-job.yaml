# Register Coder as an OAuth2 app IN Gitea, so Coder can be the workspaces'
# external Git auth provider (Coder -> Gitea OAuth; distinct from Gitea -> Keycloak SSO).
#
# Gitea generates the client id/secret, so they cannot be pre-generated by ESO.
# This idempotent post-sync Job (runs as the Gitea admin via the in-cluster API)
# ensures a single OAuth2 app named "coder" with Coder's external-auth callback,
# then writes the resulting creds to Secret `coder-gitea-oauth` in the `coder`
# namespace. Phase 3 wires Coder's CODER_EXTERNAL_AUTH_0_* to that Secret.
#
# No secret value is committed; the creds exist only in-cluster.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gitea-coder-oauth
  namespace: scm
  labels:
    app.kubernetes.io/part-of: pde-openshift-reference
---
# Read the generated Gitea admin Secret in this namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gitea-coder-oauth
  namespace: scm
  labels:
    app.kubernetes.io/part-of: pde-openshift-reference
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
    resourceNames: ["gitea-admin"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gitea-coder-oauth
  namespace: scm
  labels:
    app.kubernetes.io/part-of: pde-openshift-reference
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gitea-coder-oauth
subjects:
  - kind: ServiceAccount
    name: gitea-coder-oauth
    namespace: scm
---
# Create the `coder` namespace (if absent) and write the oauth Secret there.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gitea-coder-oauth-writer
  labels:
    app.kubernetes.io/part-of: pde-openshift-reference
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "create"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gitea-coder-oauth-writer
  labels:
    app.kubernetes.io/part-of: pde-openshift-reference
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: gitea-coder-oauth-writer
subjects:
  - kind: ServiceAccount
    name: gitea-coder-oauth
    namespace: scm
---
apiVersion: batch/v1
kind: Job
metadata:
  name: gitea-coder-oauth-register
  namespace: scm
  labels:
    app.kubernetes.io/part-of: pde-openshift-reference
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "3"
spec:
  backoffLimit: 10
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: pde-openshift-reference
    spec:
      serviceAccountName: gitea-coder-oauth
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: register
          image: registry.redhat.io/openshift4/ose-cli:latest
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: GITEA_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: gitea-admin
                  key: username
            - name: GITEA_ADMIN_PASS
              valueFrom:
                secretKeyRef:
                  name: gitea-admin
                  key: password
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              API=http://gitea-http.scm.svc:3000
              REDIR="https://coder.apps.cluster.rh-pde.coderdemo.io/external-auth/gitea/callback"
              # Wait for the Gitea API (chart is a separate Argo app; may lag).
              for i in $(seq 1 80); do
                code=$(curl -s -o /dev/null -w '%{http_code}' "$API/api/healthz" || true)
                [ "$code" = "200" ] && { echo "gitea healthy"; break; }
                echo "waiting for gitea api ($i)... http=$code"; sleep 10
              done
              AUTH=(-u "${GITEA_ADMIN_USER}:${GITEA_ADMIN_PASS}")
              # Idempotent: delete any existing app named "coder".
              existing=$(curl -fsS "${AUTH[@]}" "$API/api/v1/user/applications/oauth2")
              ids=$(printf '%s' "$existing" | tr '}' '\n' \
                    | grep '"name":"coder"' | grep -oE '"id":[0-9]+' | grep -oE '[0-9]+' || true)
              for id in $ids; do
                echo "deleting existing oauth app id=$id"
                curl -fsS "${AUTH[@]}" -X DELETE "$API/api/v1/user/applications/oauth2/$id" || true
              done
              # Create fresh confidential client with Coder's callback.
              resp=$(curl -fsS "${AUTH[@]}" -H 'Content-Type: application/json' \
                -X POST "$API/api/v1/user/applications/oauth2" \
                -d "{\"name\":\"coder\",\"confidential_client\":true,\"redirect_uris\":[\"$REDIR\"]}")
              cid=$(printf '%s' "$resp" | grep -oE '"client_id":"[^"]+"' | head -1 | sed 's/.*:"//;s/"$//')
              csec=$(printf '%s' "$resp" | grep -oE '"client_secret":"[^"]+"' | head -1 | sed 's/.*:"//;s/"$//')
              if [ -z "$cid" ] || [ -z "$csec" ]; then
                echo "FATAL: could not parse client creds from Gitea response" >&2; exit 1
              fi
              # Ensure the coder namespace (create-only: Argo usually made it already,
              # and this SA may only get/create namespaces, not patch them).
              oc get namespace coder >/dev/null 2>&1 || oc create namespace coder >/dev/null
              oc create secret generic coder-gitea-oauth -n coder \
                --from-literal=client-id="$cid" \
                --from-literal=client-secret="$csec" \
                --dry-run=client -o yaml | oc apply -f -
              echo "Wrote Secret coder/coder-gitea-oauth (Coder external Git auth)."
