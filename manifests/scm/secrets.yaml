# Gitea credentials — generated/shared in-cluster, never in git (ADR D5).
#
# 1. gitea-admin: admin username (constant) + password (ESO Password generator).
#    Chart consumes it via gitea.admin.existingSecret (keys: username, password).
# 2. gitea-oidc: the Keycloak `gitea` client secret, shaped for the chart's
#    gitea.oauth[].existingSecret (keys: key = clientID "gitea", secret =
#    the shared gitea_client_secret pulled from keycloak-realm-kv).
#
# refreshInterval "0" on the generated admin password => generate once, stable
# across restarts (regenerated only by `make reset`).
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: gitea-admin-pw
  namespace: scm
  labels:
    app.kubernetes.io/part-of: pde-openshift-reference
spec:
  length: 24
  digits: 6
  symbols: 0
  allowRepeat: true
  secretKeys:
    - password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitea-admin
  namespace: scm
  labels:
    app.kubernetes.io/part-of: pde-openshift-reference
spec:
  refreshInterval: "0"
  target:
    name: gitea-admin
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        username: "gitea_admin"
        password: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: gitea-admin-pw
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitea-oidc
  namespace: scm
  labels:
    app.kubernetes.io/part-of: pde-openshift-reference
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: keycloak-realm-kv
  target:
    name: gitea-oidc
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        key: "gitea"
        secret: "{{ .secret }}"
  data:
    - secretKey: secret
      remoteRef:
        key: keycloak-realm-secrets
        property: gitea_client_secret
