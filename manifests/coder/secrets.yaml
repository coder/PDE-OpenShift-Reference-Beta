# Coder OIDC client secret (ADR D5).
#
# Pulls the shared `coder` client secret (generated into keycloak-realm-secrets
# in the keycloak namespace) through the Kubernetes-provider ClusterSecretStore
# `keycloak-realm-kv`, and materializes it here as `coder-oidc-client-secret`
# with key `oidc-client-secret` (consumed by CODER_OIDC_CLIENT_SECRET). Same
# value Keycloak holds for the `coder` client. No secret value in git.
#
# The other two Coder Secrets come from elsewhere: `coder-db-app` (CNPG) and
# `coder-gitea-oauth` (written by the SCM phase's registration Job).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: coder-oidc-client-secret
  namespace: coder
  labels:
    app.kubernetes.io/part-of: pde-openshift-reference
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: keycloak-realm-kv
  target:
    name: coder-oidc-client-secret
    creationPolicy: Owner
  data:
    - secretKey: oidc-client-secret
      remoteRef:
        key: keycloak-realm-secrets
        property: coder_client_secret
