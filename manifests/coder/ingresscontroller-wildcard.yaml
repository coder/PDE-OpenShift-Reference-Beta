# Allow wildcard Routes on the default IngressController.
#
# Coder serves workspace apps on subdomains (*.coder.apps.cluster.rh-pde.coderdemo.io),
# which requires a Route with wildcardPolicy: Subdomain (see routes.yaml). The
# OpenShift router rejects wildcard routes unless the IngressController's
# routeAdmission.wildcardPolicy is WildcardsAllowed (default: WildcardsDisallowed).
#
# Patched scoped to this field via server-side apply + force-conflicts (the
# field is otherwise owned by the ingress operator); editing the default
# IngressController is the supported way to change router admission.
apiVersion: operator.openshift.io/v1
kind: IngressController
metadata:
  name: default
  namespace: openshift-ingress-operator
  annotations:
    argocd.argoproj.io/sync-options: ServerSideApply=true,Force=true
spec:
  routeAdmission:
    wildcardPolicy: WildcardsAllowed
