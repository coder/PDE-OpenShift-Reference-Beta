# OpenShift Route for Keycloak — edge TLS at the Route.
#
# The RHBK operator auto-creates the Service `keycloak-service` from the
# Keycloak CR. We terminate TLS here (edge) and redirect http->https.
#
# cert-manager annotations request the wildcard/Let's Encrypt cert for the
# host once the cert-manager ClusterIssuer `letsencrypt-prod` exists
# (authored in manifests/cert-manager/, a later phase). Until then the Route
# degrades gracefully to the cluster's default ingress cert (browser warning
# only) — Keycloak still serves.
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: keycloak
  namespace: keycloak
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/part-of: pde-openshift-reference
  annotations:
    cert-manager.io/issuer-kind: ClusterIssuer
    cert-manager.io/issuer-name: letsencrypt-prod
spec:
  host: keycloak.apps.cluster.rh-pde.coderdemo.io
  to:
    kind: Service
    name: keycloak-service
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
