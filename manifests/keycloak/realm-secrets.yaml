# Demo credentials — GENERATED IN-CLUSTER, never stored in git (ADR D5).
#
# Two ESO `Password` generators mint all seven demo credentials at deploy time:
#   - realm-passwords       -> alice_password, bob_password, demoadm_password
#                              (20 chars, safe symbol set !#%*-_=+:? so the
#                               realm render Job's sed injection stays safe —
#                               no | & \ / in the value)
#   - realm-client-secrets  -> coder_/gitea_/openshift_/grafana_client_secret
#                              (32-char alphanumeric; no symbols, so they are
#                               safe in URLs / env / client-secret fields)
#
# A single ExternalSecret (keycloak-realm-secrets) merges both generators into
# ONE Secret in this namespace (7 keys). refreshInterval "0" => generate once
# and never rotate out from under live consumers (a `make reset` regenerates).
#
# Cross-namespace sharing: consumers in OTHER namespaces (openshift-config now;
# coder, observability in later phases) must see the SAME generated client
# secret, so a fresh per-consumer generator is NOT an option. Instead a
# Kubernetes-provider ClusterSecretStore (keycloak-realm-kv) exposes this
# Secret cluster-wide; consumer ExternalSecrets pull individual keys from it.
#
# Mechanism validated live against the ESO operator (Password secretKeys yields
# a distinct value per key; generator merge + k8s-provider cross-ns read both
# return SecretSynced).
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: realm-passwords
  namespace: keycloak
  labels:
    app.kubernetes.io/part-of: pde-openshift-reference
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  length: 20
  digits: 4
  symbols: 3
  symbolCharacters: "!#%*-_=+:?"
  allowRepeat: true
  secretKeys:
    - alice_password
    - bob_password
    - demoadm_password
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: realm-client-secrets
  namespace: keycloak
  labels:
    app.kubernetes.io/part-of: pde-openshift-reference
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  length: 32
  digits: 8
  symbols: 0
  allowRepeat: true
  secretKeys:
    - coder_client_secret
    - gitea_client_secret
    - openshift_client_secret
    - grafana_client_secret
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-realm-secrets
  namespace: keycloak
  labels:
    app.kubernetes.io/part-of: pde-openshift-reference
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: "0"
  target:
    name: keycloak-realm-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: realm-passwords
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: realm-client-secrets
---
# ServiceAccount the Kubernetes-provider store authenticates as to read the
# generated Secret in this namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-k8s-reader
  namespace: keycloak
  labels:
    app.kubernetes.io/part-of: pde-openshift-reference
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eso-k8s-reader
  namespace: keycloak
  labels:
    app.kubernetes.io/part-of: pde-openshift-reference
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eso-k8s-reader
  namespace: keycloak
  labels:
    app.kubernetes.io/part-of: pde-openshift-reference
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: eso-k8s-reader
subjects:
  - kind: ServiceAccount
    name: eso-k8s-reader
    namespace: keycloak
---
# Let the ESO controller mint a projected token for the reader SA (required by
# the kubernetes provider's serviceAccount auth). Scoped to the one SA.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: eso-k8s-reader-token
  labels:
    app.kubernetes.io/part-of: pde-openshift-reference
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    verbs: ["create"]
    resourceNames: ["eso-k8s-reader"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: eso-k8s-reader-token
  labels:
    app.kubernetes.io/part-of: pde-openshift-reference
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: eso-k8s-reader-token
subjects:
  - kind: ServiceAccount
    name: external-secrets
    namespace: external-secrets
---
# Cluster-wide view of the keycloak-realm-secrets Secret, so consumer
# ExternalSecrets in any namespace can pull the shared client secrets.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: keycloak-realm-kv
  labels:
    app.kubernetes.io/part-of: pde-openshift-reference
spec:
  provider:
    kubernetes:
      remoteNamespace: keycloak
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          namespace: keycloak
          key: ca.crt
      auth:
        serviceAccount:
          name: eso-k8s-reader
          namespace: keycloak
