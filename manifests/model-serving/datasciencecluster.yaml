# RHOAI DataScienceCluster — minimal footprint: KServe only (ADR D3/D8).
#
# KServe in RawDeployment mode — plain Deployments/Services, no mesh, no
# serverless. RHOAI 3.x removed KServe Serverless, so RawDeployment is the only
# mode and `kserve.defaultDeploymentMode` / `kserve.serving` no longer exist in
# the schema (verified on rhods-operator 3.5.2). Every other RHOAI component is
# Removed to keep the platform small (D8); add the dashboard later if a UI is wanted.
#
# API v2 (the storage version on RHOAI 3.x). v1 is still served but has
# codeflare/modelmeshserving, which v2 dropped; applying v1 over the stored v2
# object converts them to null and the update is rejected. v2 renamed
# datasciencepipelines -> aipipelines.
apiVersion: datasciencecluster.opendatahub.io/v2
kind: DataScienceCluster
metadata:
  name: default-dsc
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/sync-options: ServerSideApply=true
spec:
  components:
    kserve:
      managementState: Managed
    dashboard:
      managementState: Removed
    workbenches:
      managementState: Removed
    aipipelines:
      managementState: Removed
    kueue:
      managementState: Removed
    ray:
      managementState: Removed
    trainingoperator:
      managementState: Removed
    trustyai:
      managementState: Removed
    modelregistry:
      managementState: Removed
