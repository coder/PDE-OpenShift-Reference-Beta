# vLLM ServingRuntime for the Qwen2.5-7B demo model (ADR D4).
#
# Dedicated runtime (not multi-model). The model is mounted at /mnt/models by
# the KServe storage-initializer from the InferenceService storageUri; vLLM
# serves an OpenAI-compatible API on :8080 that Coder's AI Gateway consumes.
#
# D4 settings: 16K context, tensor-parallel-size 1 (single A10G), Hermes tool
# calling (--tool-call-parser hermes + --enable-auto-tool-choice).
#
# Image: the vLLM CUDA runtime shipped by RHOAI 3.5.2 (the digest in its
# `vllm-cuda-runtime-template`, vLLM v0.24.0). Re-pin from
#   oc get template vllm-cuda-runtime-template -n redhat-ods-applications \
#     -o jsonpath='{.objects[0].spec.containers[0].image}'
# when RHOAI is upgraded (and update mirror/imageset-config.yaml). vLLM >= 0.10
# is required: Codex only speaks the Responses API (/v1/responses).
apiVersion: serving.kserve.io/v1alpha1
kind: ServingRuntime
metadata:
  name: vllm-qwen
  namespace: rhoai-serving
  labels:
    app.kubernetes.io/part-of: pde-openshift-reference
  annotations:
    openshift.io/display-name: "vLLM — Qwen2.5-7B-Instruct"
    argocd.argoproj.io/sync-wave: "2"
    # KServe CRDs only exist once the DataScienceCluster (wave 0) reconciles.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  supportedModelFormats:
    - name: vLLM
      autoSelect: true
  multiModel: false
  containers:
    - name: kserve-container
      image: registry.redhat.io/rhaii/vllm-cuda-rhel9@sha256:fd9540f3882b9aae5f862eba6c295d0e9c6b43f8c17b27b179481bfa330bfbc1
      command:
        - python
        - -m
        - vllm.entrypoints.openai.api_server
      args:
        - "--port=8080"
        - "--model=/mnt/models"
        - "--served-model-name=qwen2.5-7b-instruct"
        - "--max-model-len=16384"
        - "--tensor-parallel-size=1"
        - "--enable-auto-tool-choice"
        - "--tool-call-parser=hermes"
      env:
        - name: HF_HOME
          value: /tmp/hf
      ports:
        - containerPort: 8080
          protocol: TCP
